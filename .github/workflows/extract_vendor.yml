name: Extract Vendor Tree

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to extract vendor from (e.g., lineage-23.0)'
        required: true
        default: lineage-23.0

jobs:
  extract-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/pipx

      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.branch }}
          path: device/infinix/X6886

      - name: Checkout extract-utils
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_tools_extract-utils
          path: tools/extract-utils

      - name: Checkout extract-tools
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_extract-tools
          path: prebuilts/extract-tools

      - name: Add extract-tools to PATH
        run: |
          echo "$GITHUB_WORKSPACE/prebuilts/extract-tools/linux-x86/bin" >> $GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Clone firmware dump
        run: |
          git clone --depth=1 https://gitlab.com/rama-firmware-dumps/infinix/Infinix-X6886.git dump

      - name: Run extract-files.py
        working-directory: device/infinix/X6886
        env:
          PYTHONPATH: ../../../tools/extract-utils
        run: |
          chmod +x extract-files.py
          ./extract-files.py ../../../dump

      - name: Verify and Locate Extraction Result
        run: |
          if [ -d "vendor/infinix/X6886" ]; then
            echo "TARGET_VENDOR_DIR=vendor/infinix/X6886" >> $GITHUB_ENV
            find vendor/infinix/X6886 -type f | head -30
          elif [ -d "device/infinix/X6886/vendor" ]; then
            echo "TARGET_VENDOR_DIR=device/infinix/X6886/vendor" >> $GITHUB_ENV
            find device/infinix/X6886/vendor -type f | head -30
          elif [ -d "vendor" ]; then
            echo "TARGET_VENDOR_DIR=vendor" >> $GITHUB_ENV
            find vendor -type f | head -30
          else
            echo "ERROR: Blobs cannot found!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Clone target vendor repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone --branch ${{ github.event.inputs.branch }} https://${GH_TOKEN}@github.com/${{ github.repository_owner }}/vendor_infinix_X6886.git extracted_vendor || \
          git clone https://${GH_TOKEN}@github.com/${{ github.repository_owner }}/vendor_infinix_X6886.git extracted_vendor

      - name: Update vendor repository
        working-directory: extracted_vendor
        run: |
          git checkout ${{ github.event.inputs.branch }} 2>/dev/null || git checkout -b ${{ github.event.inputs.branch }}

          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

          cp -a ../${{ env.TARGET_VENDOR_DIR }}/. .

          find proprietary -type f -size +99M | sort > skip-blobs.txt 2>/dev/null || touch skip-blobs.txt

          if [ -s skip-blobs.txt ]; then
            echo "Skipping oversized blobs:"
            cat skip-blobs.txt
            while read -r file; do
              rm -f "$file"
            done < skip-blobs.txt
          fi
          rm -f skip-blobs.txt

          git add .

          if git diff --cached --quiet; then
            echo "No changes detected in vendor tree. Skipping push."
            exit 0
          fi

          git commit -m "vendor: infinix: X6886: update proprietary files from branch ${{ github.event.inputs.branch }}"
          git push origin ${{ github.event.inputs.branch }}
